<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background: rounded square, npm brand red -->
  <rect x="0" y="0" width="128" height="128" rx="20" fill="#CB3837"/>

  <!-- Package box - front facing -->
  <!-- Box body -->
  <rect x="30" y="48" width="68" height="48" rx="4" fill="#FFFFFF"/>

  <!-- Lid (slightly open, offset upward) -->
  <rect x="26" y="32" width="76" height="14" rx="4" fill="#F5F5F5"/>

  <!-- npm text on box -->
  <text x="64" y="80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" fill="#CB3837">npm</text>

  <!-- 4-pointed sparkle star (symmetric) -->
  <path d="M108 4 L111 13 L120 16 L111 19 L108 28 L105 19 L96 16 L105 13 Z" fill="#FFD700" stroke="#FFD700" stroke-width="4" stroke-linejoin="round"/>
</svg>
